esphome:
  name: dfltech-switch
  friendly_name: DFLTech Switch
  name_add_mac_suffix: true
  min_version: 2026.6.0

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 4MB
  framework:
    type: esp-idf

# Super Mini uses native USB for serial (USB-C).
logger:
  hardware_uart: USB_SERIAL_JTAG

api:

# Lower TX power reduces heat on Super Mini boards (also helps RF stability).
# LIGHT power save keeps STA cooler than NONE (NONE was only needed for SoftAP joins).
# Fallback AP starts after 90s without STA — prefer USB Improv for first setup.
wifi:
  output_power: 8.5dB
  power_save_mode: LIGHT
  reboot_timeout: 0s
  ap:
    password: "dfltech-setup"

# Provision Wi-Fi over the same USB session after browser flash (preferred over SoftAP).
improv_serial:

captive_portal:

packages:
  key_1: !include
    file: key.yaml
    vars:
      key: "1"
      pin: GPIO13
  key_2: !include
    file: key.yaml
    vars:
      key: "2"
      pin: GPIO12
  key_3: !include
    file: key.yaml
    vars:
      key: "3"
      pin: GPIO11
  key_4: !include
    file: key.yaml
    vars:
      key: "4"
      pin: GPIO10
  key_5: !include
    file: key.yaml
    vars:
      key: "5"
      pin: GPIO9
  key_6: !include
    file: key.yaml
    vars:
      key: "6"
      pin: GPIO8

switch:
  - platform: factory_reset
    id: factory_reset_switch
    internal: true

binary_sensor:
  # BOOT button on Super Mini (GPIO0)
  - platform: gpio
    id: boot_button
    internal: true
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    on_click:
      - min_length: 10s
        max_length: 20s
        then:
          - switch.turn_on: factory_reset_switch
